name: tests

# `pull_request` (NOT pull_request_target): code from forks runs without access to
# repository secrets. Nothing here needs credentials.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # ends of the supported range

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Import smoke test
        run: python -c "import harness; print('harness imports cleanly')"

      - name: Run tests
        shell: bash
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            pytest tests -q
          else
            echo "no test files in tests/ yet — nothing to run"
          fi

      # Catches the class of defect where the package declares a backend that
      # cannot be imported, so `pip install .` fails for everyone.
      - name: Build check
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            python -m pip install --upgrade build
            python -m build --wheel --outdir dist/
          else
            echo "no pyproject.toml — skipping build check"
          fi
